    <div class="drawer-hd">
      <div class="sec-ttl"><span class="dot dp"></span>Add Trade</div>
      <button class="drawer-close" onclick="closeTradeDrawer()">&#10005; Close</button>
    </div>
    <div class="fi">
      <!-- Ticker -->
      <div class="field">
        <label>Ticker</label>
        <input type="text" id="f-ticker" placeholder="IBIT" spellcheck="false" autocomplete="off" oninput="setTicker(this.value)" style="text-transform:uppercase">
      </div>
      <!-- Type -->
      <div class="field fi-full">
        <label>Type</label>
        <div class="tg">
          <button class="tb tp active" id="tog-PUT" onclick="setType('PUT')">PUT</button>
          <button class="tb tc" id="tog-CALL" onclick="setType('CALL')">CALL</button>
          <button class="tb th" id="tog-HOLDING" onclick="setType('HOLDING')">HOLDING</button>
        </div>
      </div>
      <!-- Open date -->
      <div class="field"><label>Open Date</label><div class="date-wrap"><input type="date" id="f-date"><button type="button" class="cal-btn" onclick="document.getElementById('f-date').showPicker()" title="Pick date">&#128197;</button></div></div>
      <!-- Expiry -->
      <div class="field" id="field-expiry"><label>Expiry</label><div class="date-wrap"><input type="date" id="f-expiry" onchange="autoDTE()"><button type="button" class="cal-btn" onclick="document.getElementById('f-expiry').showPicker()" title="Pick date">&#128197;</button></div></div>
      <!-- DTE -->
      <div class="field" id="field-dte"><label>DTE</label><input type="number" id="f-dte" placeholder="21"></div>
    </div>

    <div class="holding-hint" id="holding-hint">
      <strong>Holding / Spot Entry</strong> &mdash; Log shares you already own.<br>
      Enter your <strong>cost basis</strong> per share under Cost Basis, your <strong>share count</strong> as Size.
    </div>
    <div class="fb">
      <div class="field"><label id="f-strike-lbl">Strike ($)</label><input type="number" id="f-strike" placeholder="60" step="1"></div>
      <div class="field" id="field-size-wrap">
        <label>Size</label>
        <input type="number" id="f-size" placeholder="1" step="1">
        <span id="f-size-hint" style="font-size:.65rem;color:var(--mu);font-family:var(--mono);margin-top:2px"></span>
      </div>
    </div>
    <div class="fb" id="field-premium">
      <div class="field fi-full"><label>Premium ($)</label><input type="number" id="f-prem" placeholder="120" step="1"></div>
    </div>
    <div class="fb" id="field-outcome">
      <div class="field fi-full">
        <label>Outcome</label>
        <div class="tg">
          <button class="tb to active" id="tog-OPEN" onclick="setOut('OPEN')">OPEN</button>
          <button class="tb te" id="tog-EXPIRED" onclick="setOut('EXPIRED')">EXPIRED</button>
          <button class="tb ta" id="tog-ASSIGNED" onclick="setOut('ASSIGNED')">ASSIGNED</button>
          <button class="tb tk" id="tog-CALLED" onclick="setOut('CALLED')">CALLED</button>
        </div>
      </div>
    </div>
    <div style="padding:0 20px 20px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end">
      <div></div>
      <button class="btn btn-p" style="padding:9px 22px" onclick="wheelerAddTrade()">Add &rarr;</button>
    </div>
    <div class="ferr" id="ferr"></div>
