    <div class="drawer-hd">
      <div class="sec-ttl"><span class="dot dp"></span>Add Existing Assets</div>
      <button class="drawer-close" onclick="closeTradeDrawer()">&#10005; Close</button>
    </div>
    <div class="fi">
      <!-- Asset -->
      <div class="field fi-full">
        <label>Asset</label>
        <div class="tg">
          <button class="tb active" id="ab-BTC" onclick="setAsset('BTC')" style="color:var(--btc);border-color:var(--btcb);background:var(--btcd)">&#9654; BTC</button>
          <button class="tb" id="ab-ETH" onclick="setAsset('ETH')">&#9670; ETH</button>
          <button class="tb" id="ab-HYPE" onclick="setAsset('HYPE')" style="color:var(--mu);border-color:var(--bd2);background:transparent">&#9632; HYPE</button>
          <button class="tb" id="ab-SOL"  onclick="setAsset('SOL')"  style="color:var(--mu);border-color:var(--bd2);background:transparent">&#9679; SOL</button>
        </div>
      </div>
      <!-- Open date -->
      <div class="field"><label>Purchase Date</label><div class="date-wrap"><input type="date" id="f-date"><button type="button" class="cal-btn" onclick="document.getElementById('f-date').showPicker()" title="Pick date">&#128197;</button></div></div>
    </div>

    <div class="holding-hint" id="holding-hint" style="display:block">
      <strong>Spot / Manual Entry</strong> &mdash; Log assets you already hold from spot purchases.<br>
      Enter your <strong>cost basis</strong> (what you paid per token) under Cost Basis / Token, your <strong>quantity</strong> as Size.<br>
      The tracker will treat this as an open position so you can track your holdings.
    </div>
    <div class="fb">
      <div class="field"><label id="f-strike-lbl">Cost Basis / Token ($)</label><input type="number" id="f-strike" placeholder="75000" step="100"></div>
      <div class="field" id="field-size-wrap">
        <label>Size</label>
        <input type="number" id="f-size" value="0.05" step="0.01">
        <span id="f-size-hint" style="font-size:.65rem;color:var(--mu);font-family:var(--mono);margin-top:2px">min 0.05 BTC</span>
      </div>
    </div>
    <div style="padding:0 20px 20px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end">
      <div></div>
      <button class="btn btn-p" style="padding:9px 22px" onclick="addTrade()">Add &rarr;</button>
    </div>
    <div class="ferr" id="ferr"></div>
